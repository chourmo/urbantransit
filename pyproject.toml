[project]
authors = [{name = "chourmo", email = "vincenttinet@icloud.com"}]
dependencies = ["pandas", "geopandas >= 1.1.3,<2", "pyarrow", "scikit-learn", "listandstruct"]
name = "urbantransit"
requires-python = ">= 3.11"
version = "0.1.2"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "https://prefix.dev/urbandev"]
platforms = ["win-64", "linux-64", "osx-arm64"]
preview = ["pixi-build"]

[tool.pixi.pypi-dependencies]
urbantransit = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pandas = ">=3.0.2,<4"
geopandas = ">=1.1.3,<2"
pyarrow = ">=23.0.1,<24"
scikit-learn = ">=1.8.0,<2"
listandstruct = { version = ">=0.0.2,<0.0.3", channel = "https://prefix.dev/urbandev" }

[tool.pixi.package] 
name = "urbantransit"
version = "0.1.2"

[tool.pixi.package.build] 
backend = { name = "pixi-build-python", version = "0.*" }

[tool.pixi.package.host-dependencies] 
hatchling = "==1.26.3"

[tool.pixi.package.run-dependencies] 
pandas = ">=3.0.2,<4"
geopandas = ">=1.1.3,<2"
pyarrow = ">=23.0.1,<24"
scikit-learn = ">=1.8.0,<2"
listandstruct = { version = ">=0.0.2,<0.0.3", channel = "https://prefix.dev/urbandev" }