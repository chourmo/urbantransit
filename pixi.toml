[workspace]
authors = ["Vincent Tinet <vincent@example.com>"]
channels = ["conda-forge", "https://prefix.dev/urbandev"]
name = "urbantransit"
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.1.0"

[tasks]
run = "python -m urbantransit"

[dependencies]
python = ">=3.14.4,<3.15"
pip = ">=25.0,<26"
pandas = ">=3.0.2,<4"
geopandas = ">=1.1.3,<2"
pyarrow = ">=23.0.1,<24"
scikit-learn = ">=1.8.0,<2"
listandstruct = ">=0.0.2,<0.0.3"

[pypi-dependencies]
urbantransit = { path = ".", editable = true }
ruff = ">=0.15.10, <0.16"
